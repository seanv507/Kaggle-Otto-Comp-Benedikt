[project]
name = "otto-benny"
version = "0.1.0"
description = "Benny's part of the 3rd place OTTO solution, converted to Polars"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beartype>=0.22.9",
    "cudf-polars-cu13>=26.10",
    "numpy>=2.2.6",
    # Chris's part (../Kaggle-OTTO-Comp), for its covisits.py: a path dependency below
    "otto",
    # cudf-polars-cu13 26.10 needs polars>=1.35,<1.45; see CLAUDE.md
    "polars[all]>=1.44,<1.45",
    "transformers>=4.46",  # XLNetModel for the 01e transformer
]

# torch: `uv sync --extra cu132` on a GPU machine, `--extra cpu` otherwise
[project.optional-dependencies]
cpu = ["torch>=2.15"]
cu132 = ["torch>=2.15"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]

[tool.uv.sources]
otto = { path = "../Kaggle-OTTO-Comp", editable = true }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.5",
    "ruff>=0.11.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Editable install that puts the repo root on sys.path, so scripts in
# numbered directories can import root modules (event_types, paths).
[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel]
only-include = ["engines.py", "event_types.py", "folds.py", "metrics.py", "paths.py"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
extend-select = ["B"]
